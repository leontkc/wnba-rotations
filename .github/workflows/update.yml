name: Update WNBA Games

on:
  schedule:
    # Daily at 13:00 UTC (~9 AM ET) during WNBA season (May–Oct)
    - cron: '0 13 * * *'
  workflow_dispatch:  # also allow manual trigger

permissions:
  contents: write

jobs:
  build:
    # stats.nba.com blocks GitHub-hosted runners, so this runs on a self-hosted
    # runner (Windows PC). Steps use Git Bash by full (short-name) path because
    # the runner service's PATH doesn't include it.
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check if WNBA season (skip Nov–Apr on schedule)
        if: github.event_name == 'schedule'
        run: |
          MONTH=$(date -u +%m)
          if [ "$MONTH" -lt 5 ] || [ "$MONTH" -gt 10 ]; then
            echo "Off-season (month $MONTH), skipping."
            echo "SKIP=true" >> $GITHUB_ENV
          fi

      - name: Checkout repo
        if: env.SKIP != 'true'
        uses: actions/checkout@v4

      # Uses the runner machine's Python in a venv (setup-python needs admin
      # rights on self-hosted Windows).
      - name: Install dependencies
        if: env.SKIP != 'true'
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt

      - name: Run pipeline
        if: env.SKIP != 'true'
        run: |
          YEAR=$(date -u +%Y)
          .venv/Scripts/python -m pipeline.build_season --seasons "$YEAR" "$((YEAR - 1))"

      - name: Commit and push if anything changed
        if: env.SKIP != 'true'
        run: |
          git config user.name  "wnbarotations-bot"
          git config user.email "bot@wnbarotations.com"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update: new WNBA games $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
